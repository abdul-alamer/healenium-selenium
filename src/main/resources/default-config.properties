# -----------------------------------------------------------------------------
# Framework defaults. This is the base layer of the configuration stack and the
# only file that has to define every key; overlays may define a subset.
#
#   -D system property  >  environment variable  >  <env>-config.properties
#                                                >  this file
#
# Two substitutions are supported in values:
#   ${env:VAR_NAME}   - operating system environment variable, empty if unset
#   ${other-key}      - another key from the merged configuration
#
# See docs/CONFIGURATION.md.
# -----------------------------------------------------------------------------

# --- Application under test --------------------------------------------------
# Demo target: a public site purpose-built for flaky and dynamic DOM scenarios.
# Page objects never hard-code this; they resolve paths through BasePage.openPath.
base-url = https://the-internet.herokuapp.com

# --- Browser -----------------------------------------------------------------
browser = chrome
headless = true
# Empty means "drive a local browser via Selenium Manager".
remote-url =
selenium-window-width = 1366
selenium-window-height = 768
selenium-window-position-x = 0
selenium-window-position-y = 0

# --- Timeouts (seconds) ------------------------------------------------------
selenium-implicit-wait-timeout-in-seconds = 5
selenium-web-driver-wait-timeout-in-seconds = 30
selenium-page-load-timeout-in-seconds = 30
selenium-script-timeout-in-seconds = 30

# --- Retry -------------------------------------------------------------------
retry-attempts = 3
retry-backoff-in-millis = 200

# --- Execution ---------------------------------------------------------------
parallel-thread-count = 1
screenshot-on-failure = true

# --- Self-healing (Healenium) -----------------------------------------------
# Spelled exactly as Healenium spells them so HealingConfig can forward them
# straight through as system properties with no translation layer.
heal-enabled = true
hlm.server.url = http://localhost:7878
hlm.imitator.url = http://localhost:8000
recovery-tries = 1
score-cap = 0.5

# --- Reporting / IO ----------------------------------------------------------
allure-results-dir = build/allure-results
healing-report-dir = build/healenium/report
download-dir = build/downloads
tmp-dir = build/tmp
