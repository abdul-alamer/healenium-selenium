# Overlay applied when framework.env=ci (./gradlew test -Penvironment=ci).

headless = true
parallel-thread-count = 2
screenshot-on-failure = true

# Demonstrates environment-variable substitution: unset means "start a local browser", so the same
# overlay works on a runner with a browser installed and on one pointing at a Selenium container.
remote-url = ${env:SELENIUM_REMOTE_URL}

# CI runners are slower and noisier than a laptop.
selenium-web-driver-wait-timeout-in-seconds = 45
selenium-page-load-timeout-in-seconds = 60
retry-attempts = 3
