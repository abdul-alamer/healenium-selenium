# Healenium's own configuration file, read by healenium-web from the classpath.
#
# Every key here can be overridden at runtime with a system property of the same name, which is how
# the framework forwards its configuration (HealingConfig.applySystemProperties) and how you switch
# healing off for a release gate:
#
#     ./gradlew test -PhealEnabled=false        # -> -Dheal-enabled=false
#
# recovery-tries : how many stored candidate node trees to try per broken locator
# score-cap      : minimum similarity score (0.0-1.0) for a candidate to be accepted
recovery-tries = 1
score-cap = 0.5
heal-enabled = true
hlm.server.url = http://localhost:7878
hlm.imitator.url = http://localhost:8000
