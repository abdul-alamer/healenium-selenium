# Cucumber configuration for the JUnit Platform engine.
#
# System properties override every value here, which is how the Gradle -P flags reach the suite:
#   -Ptags="@smoke"  ->  -Dcucumber.filter.tags="@smoke"
#   -Pthreads=4      ->  -Dcucumber.execution.parallel.config.fixed.parallelism=4
#                        -Dcucumber.execution.parallel.enabled=true

cucumber.glue = io.github.abdulalamer.selfhealing.demo
cucumber.plugin = pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, io.github.abdulalamer.selfhealing.demo.support.SuiteLifecycleListener
cucumber.publish.quiet = true
cucumber.snippet-type = camelcase

# Parallelism is off by default and switched on by -Pthreads. The driver is held in a ThreadLocal,
# so each scenario thread owns its own browser.
cucumber.execution.parallel.enabled = false
cucumber.execution.parallel.config.strategy = fixed
cucumber.execution.parallel.config.fixed.parallelism = 1
