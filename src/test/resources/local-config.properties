# Overlay applied when framework.env=local, which is the default.
# Only the keys that differ from default-config.properties belong here.

# Watch the browser work while developing.
headless = false

# Self-healing needs the backend from docker/docker-compose.yml. If you are not running it, use
#     ./gradlew test -PhealEnabled=false -Ptags="not @self-healing"
heal-enabled = true
